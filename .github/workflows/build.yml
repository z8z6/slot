name: Build & Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create build dir
        run: mkdir build

      - name: Configure
        run: cmake .. -A x64
        working-directory: build

      - name: Build
        run: cmake --build . --config Debug --target slot
        working-directory: build

      # 测试目标使用无窗口运行时，不要求 CI runner 提供图形桌面或 DX12 设备。
      - name: Build tests
        run: cmake --build . --config Debug --target slot_tests
        working-directory: build

      - name: Run tests
        run: ctest --build-config Debug --output-on-failure --no-tests=error
        working-directory: build

      - name: Install Doxygen & Graphviz
        run: |
            choco install doxygen.install -y
            choco install graphviz -y

      - name: Add Graphviz to PATH
        run: echo "C:\Program Files\Graphviz\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Doxygen Docs
        run: |
            doxygen.exe Doxyfile
            exit 0

      - name: Upload Documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html
          name: github-pages-${{ github.run_id }}

  deploy-docs:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
