name: Build & Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create build dir
        run: mkdir build

      - name: Configure
        run: cmake .. -G "Visual Studio 17 2022" -A x64
        working-directory: build

      - name: Build
        run: cmake --build . --config Debug
        working-directory: build

      - name: Install Doxygen & Graphviz
        run: |
            choco install doxygen.install -y
            choco install graphviz -y

      - name: Add Graphviz to PATH
        run: echo "C:\Program Files\Graphviz\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Doxygen Docs
        run: |
            doxygen.exe Doxyfile
            exit 0

      - name: Upload Documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html
          name: github-pages-${{ github.run_id }}

  deploy-docs:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}